databases:
  - name: biznesjon-db
    plan: free
    databaseName: biznesjon

services:
  # ─── Backend API (NestJS) ────────────────────────────────────────────────────
  - type: web
    name: biznesjon-api
    runtime: node
    plan: free
    buildCommand: >
      npm install --include=dev &&
      npm --workspace @biznesjon/api run prisma:generate &&
      npx prisma db push --schema apps/api/prisma/schema.prisma --accept-data-loss &&
      npm run build:api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: biznesjon-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false   # Set to your web service URL: https://biznesjon-web.onrender.com

  # ─── Frontend Web (Next.js) ──────────────────────────────────────────────────
  - type: web
    name: biznesjon-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:web
    startCommand: npm --workspace @biznesjon/web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: NEXT_PUBLIC_API_URL
        sync: false   # Set to your API service URL: https://biznesjon-api.onrender.com/api/v1
